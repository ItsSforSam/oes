# cargo-features = ["build-std"]

[workspace]
resolver = "3"
members = [
    "init/start",
    "init/start-impl",
    "mm/core",
    "arch",
    "arch/common",
    "arch/x86",
    "drivers/core",
    ]
default-members = ["init/start"]

[workspace.package]
publish = false
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
uefi = {version = "0.37.0", default-features = false}
cfg-if = {version = "1"}
bytemuck = {version = "1", default-features = false}
[workspace.lints.clippy]
arithmetic_side_effects = "deny"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"