[package]
name = "oes-arch"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
uefi = {workspace = true, optional = true}
multiboot2 = {workspace = true, optional = true}
cfg-if = {workspace = true}
bytemuck = {workspace = true}
spin = {features = ["once"], workspace = true}
[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15.4"
[features]
uefi = ["dep:uefi"]
multiboot2 = ["dep:multiboot2"]
# Expose alloc crate impls
alloc = []
# INTERNAL! USED FOR TESTING
libtest = []
[build-dependencies]
bindgen = "0.72.1"

[[test]]
name= "oes-arch"
path = "src/lib.rs"
required-features = ["libtest"]